<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="tGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="tSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="tRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Три таймаута: кто прекратил ожидание и на каком шаге</text>

  <!-- ================= ПАНЕЛЬ 1: соединение не встало ================= -->
  <rect x="24" y="52" width="288" height="350" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="168" y="78" text-anchor="middle" font-size="14.5" font-weight="600" fill="#991b1b">Соединение так и не встало</text>

  <rect x="48" y="94" width="96" height="36" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="96" y="118" text-anchor="middle" font-size="12.5" fill="#0f172a">клиент</text>
  <rect x="192" y="94" width="96" height="36" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="240" y="118" text-anchor="middle" font-size="12.5" fill="#0f172a">сервер</text>
  <line x1="96" y1="130" x2="96" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="240" y1="130" x2="240" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="168" y="152" text-anchor="middle" font-size="11.5" fill="#334155">SYN</text>
  <line x1="96" y1="160" x2="238" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#tSlate)"/>
  <text x="168" y="184" text-anchor="middle" font-size="11.5" fill="#991b1b">ответа нет</text>
  <line x1="238" y1="192" x2="98" y2="192" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="168" y="216" text-anchor="middle" font-size="11.5" fill="#334155">SYN (повтор)</text>
  <line x1="96" y1="224" x2="238" y2="224" stroke="#334155" stroke-width="2" marker-end="url(#tSlate)"/>
  <text x="168" y="248" text-anchor="middle" font-size="11.5" fill="#991b1b">ответа нет</text>
  <line x1="238" y1="256" x2="98" y2="256" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 5"/>

  <text x="168" y="282" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">сдался клиент: --connect-timeout 3</text>

  <rect x="44" y="296" width="248" height="88" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
  <text x="168" y="320" text-anchor="middle" font-size="12.5" fill="#991b1b" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">код 28, time_connect = 0</text>
  <text x="168" y="342" text-anchor="middle" font-size="12" fill="#0f172a">клиент не дождался соединения</text>
  <text x="168" y="364" text-anchor="middle" font-size="12" fill="#334155">чинить: адрес, маршрут, фаервол</text>

  <!-- ================= ПАНЕЛЬ 2: ответа нет ================= -->
  <rect x="336" y="52" width="288" height="350" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="78" text-anchor="middle" font-size="14.5" font-weight="600" fill="#92400e">Соединение есть, ответа нет</text>

  <rect x="360" y="94" width="96" height="36" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="408" y="118" text-anchor="middle" font-size="12.5" fill="#0f172a">клиент</text>
  <rect x="504" y="94" width="96" height="36" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="552" y="118" text-anchor="middle" font-size="12.5" fill="#0f172a">сервер</text>
  <line x1="408" y1="130" x2="408" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="552" y1="130" x2="552" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="480" y="152" text-anchor="middle" font-size="11.5" fill="#334155">SYN</text>
  <line x1="408" y1="160" x2="550" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#tSlate)"/>
  <text x="480" y="184" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15803d">SYN-ACK</text>
  <line x1="552" y1="192" x2="410" y2="192" stroke="#16a34a" stroke-width="2.2" marker-end="url(#tGreen)"/>
  <text x="480" y="216" text-anchor="middle" font-size="11.5" fill="#334155">GET / HTTP/1.1</text>
  <line x1="408" y1="224" x2="550" y2="224" stroke="#334155" stroke-width="2" marker-end="url(#tSlate)"/>
  <text x="480" y="248" text-anchor="middle" font-size="11.5" fill="#92400e">тишина: сервис думает</text>
  <line x1="550" y1="256" x2="410" y2="256" stroke="#b45309" stroke-width="2" stroke-dasharray="5 5"/>

  <text x="480" y="282" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">сдался клиент: --max-time 5</text>

  <rect x="356" y="296" width="248" height="88" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="480" y="320" text-anchor="middle" font-size="12.5" fill="#92400e" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">код 28, time_connect ≈ 0.0002</text>
  <text x="480" y="342" text-anchor="middle" font-size="12" fill="#0f172a">клиент не дождался ответа</text>
  <text x="480" y="364" text-anchor="middle" font-size="12" fill="#334155">чинить: логи и нагрузку сервиса</text>

  <!-- ================= ПАНЕЛЬ 3: сервер закрыл сам ================= -->
  <rect x="648" y="52" width="288" height="350" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="792" y="78" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1e3a8a">Сервер закрыл соединение сам</text>

  <rect x="672" y="94" width="96" height="36" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="720" y="118" text-anchor="middle" font-size="12.5" fill="#0f172a">клиент</text>
  <rect x="816" y="94" width="96" height="36" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="864" y="118" text-anchor="middle" font-size="12.5" fill="#0f172a">сервер</text>
  <line x1="720" y1="130" x2="720" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="864" y1="130" x2="864" y2="292" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="792" y="152" text-anchor="middle" font-size="11.5" fill="#334155">SYN</text>
  <line x1="720" y1="160" x2="862" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#tSlate)"/>
  <text x="792" y="184" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15803d">SYN-ACK</text>
  <line x1="864" y1="192" x2="722" y2="192" stroke="#16a34a" stroke-width="2.2" marker-end="url(#tGreen)"/>
  <text x="792" y="216" text-anchor="middle" font-size="11.5" fill="#334155">GET / HTTP/1.1</text>
  <line x1="720" y1="224" x2="862" y2="224" stroke="#334155" stroke-width="2" marker-end="url(#tSlate)"/>
  <text x="792" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">FIN — «разговор окончен»</text>
  <line x1="864" y1="256" x2="722" y2="256" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#tRed)"/>

  <text x="792" y="282" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">сдался сервер, а не клиент</text>

  <rect x="668" y="296" width="248" height="88" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="792" y="320" text-anchor="middle" font-size="12.5" fill="#1e3a8a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">код 52 — пустой ответ</text>
  <text x="792" y="342" text-anchor="middle" font-size="12" fill="#0f172a">соединение оборвал сервер</text>
  <text x="792" y="364" text-anchor="middle" font-size="12" fill="#334155">чинить: таймауты на той стороне</text>

  <text x="480" y="428" text-anchor="middle" font-size="13.5" fill="#0f172a">Все три случая выглядят одинаково — «повисло и отвалилось». Различают их time_connect и то, кто прекратил ожидание.</text>
  <text x="480" y="452" text-anchor="middle" font-size="12.5" fill="#64748b">Смотрите сначала на time_connect: ноль — чините сеть, почти ноль — чините приложение, код 52 — идите на ту сторону.</text>
</svg>
