<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="okArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="badArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Адрес привязки: почему «локально работает, снаружи нет»</text>

  <!-- ЛЕВАЯ ПАНЕЛЬ -->
  <rect x="24" y="52" width="440" height="330" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="244" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">--bind 127.0.0.1</text>
  <text x="244" y="100" text-anchor="middle" font-size="12.5" fill="#7f1d1d">слушает только loopback</text>

  <!-- машина слева -->
  <rect x="150" y="118" width="190" height="92" rx="9" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="245" y="145" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">сервер :8000</text>
  <text x="245" y="167" text-anchor="middle" font-size="12" fill="#64748b">процесс python3</text>
  <text x="245" y="192" text-anchor="middle" font-size="12" fill="#334155">открыт на lo</text>

  <!-- свой curl -->
  <rect x="52" y="248" width="152" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="128" y="270" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">curl с этой же</text>
  <text x="128" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">машины</text>
  <line x1="150" y1="248" x2="196" y2="214" stroke="#16a34a" stroke-width="2.5" marker-end="url(#okArr)"/>
  <text x="106" y="326" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">200 OK</text>

  <!-- сосед -->
  <rect x="286" y="248" width="152" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="362" y="270" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">curl с другой</text>
  <text x="362" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">машины</text>
  <line x1="338" y1="250" x2="314" y2="232" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="300" y="230" text-anchor="middle" font-size="21" font-weight="700" fill="#dc2626">✗</text>
  <text x="378" y="326" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b91c1c">Connection refused</text>
  <text x="244" y="360" text-anchor="middle" font-size="12.5" fill="#7f1d1d">Порт занят и виден в `ss` — но только изнутри.</text>

  <!-- ПРАВАЯ ПАНЕЛЬ -->
  <rect x="496" y="52" width="440" height="330" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="716" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#166534" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">--bind 0.0.0.0</text>
  <text x="716" y="100" text-anchor="middle" font-size="12.5" fill="#14532d">слушает на всех интерфейсах</text>

  <rect x="622" y="118" width="190" height="92" rx="9" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="717" y="145" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">сервер :8000</text>
  <text x="717" y="167" text-anchor="middle" font-size="12" fill="#64748b">процесс python3</text>
  <text x="717" y="192" text-anchor="middle" font-size="12" fill="#334155">открыт на lo и eth0</text>

  <rect x="524" y="248" width="152" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="270" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">curl с этой же</text>
  <text x="600" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">машины</text>
  <line x1="622" y1="248" x2="668" y2="214" stroke="#16a34a" stroke-width="2.5" marker-end="url(#okArr)"/>
  <text x="578" y="326" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">200 OK</text>

  <rect x="758" y="248" width="152" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="834" y="270" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">curl с другой</text>
  <text x="834" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">машины</text>
  <line x1="810" y1="248" x2="768" y2="214" stroke="#16a34a" stroke-width="2.5" marker-end="url(#okArr)"/>
  <text x="850" y="326" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">200 OK</text>
  <text x="716" y="360" text-anchor="middle" font-size="12.5" fill="#14532d">Доступен и снаружи — но теперь его видит вся сеть.</text>

  <text x="480" y="410" text-anchor="middle" font-size="13.5" fill="#0f172a">Слева и справа порт одинаково «слушается»: разница не в порте, а в адресе привязки.</text>
  <text x="480" y="430" text-anchor="middle" font-size="12.5" fill="#64748b">Смотри не только номер порта в `ss`, но и адрес слева от двоеточия: 127.0.0.1 против 0.0.0.0.</text>
</svg>
