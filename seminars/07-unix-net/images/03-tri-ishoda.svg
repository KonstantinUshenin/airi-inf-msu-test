<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="aSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Три исхода стука в TCP-порт</text>

  <!-- ================= ПАНЕЛЬ 1 ================= -->
  <rect x="24" y="52" width="288" height="330" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="168" y="78" text-anchor="middle" font-size="14.5" font-weight="600" fill="#166534">Слушатель есть</text>

  <rect x="48" y="94" width="96" height="40" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="96" y="119" text-anchor="middle" font-size="12.5" fill="#0f172a">клиент</text>
  <rect x="192" y="94" width="96" height="40" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="240" y="119" text-anchor="middle" font-size="12.5" fill="#0f172a">хост</text>

  <line x1="96" y1="134" x2="96" y2="286" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="240" y1="134" x2="240" y2="286" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="168" y="170" text-anchor="middle" font-size="12" fill="#334155">SYN</text>
  <line x1="96" y1="180" x2="238" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#aSlate)"/>
  <text x="168" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">SYN-ACK</text>
  <line x1="240" y1="232" x2="98" y2="232" stroke="#16a34a" stroke-width="2.4" marker-end="url(#aGreen)"/>
  <text x="168" y="268" text-anchor="middle" font-size="11.5" fill="#64748b">ответ мгновенно</text>

  <rect x="44" y="298" width="248" height="66" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="168" y="322" text-anchor="middle" font-size="12.5" fill="#15803d" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">succeeded!</text>
  <text x="168" y="346" text-anchor="middle" font-size="12" fill="#334155">Сервис на месте — иди выше</text>

  <!-- ================= ПАНЕЛЬ 2 ================= -->
  <rect x="336" y="52" width="288" height="330" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="78" text-anchor="middle" font-size="14.5" font-weight="600" fill="#92400e">Никто не слушает</text>

  <rect x="360" y="94" width="96" height="40" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="408" y="119" text-anchor="middle" font-size="12.5" fill="#0f172a">клиент</text>
  <rect x="504" y="94" width="96" height="40" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="552" y="119" text-anchor="middle" font-size="12.5" fill="#0f172a">хост</text>

  <line x1="408" y1="134" x2="408" y2="286" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="552" y1="134" x2="552" y2="286" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="480" y="170" text-anchor="middle" font-size="12" fill="#334155">SYN</text>
  <line x1="408" y1="180" x2="550" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#aSlate)"/>
  <text x="480" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">RST</text>
  <line x1="552" y1="232" x2="410" y2="232" stroke="#b45309" stroke-width="2.4" marker-end="url(#aAmber)"/>
  <text x="480" y="268" text-anchor="middle" font-size="11.5" fill="#64748b">отказ мгновенно</text>

  <rect x="356" y="298" width="248" height="66" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="480" y="322" text-anchor="middle" font-size="12.5" fill="#92400e" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">Connection refused</text>
  <text x="480" y="346" text-anchor="middle" font-size="12" fill="#334155">Хост жив, сервис не запущен</text>

  <!-- ================= ПАНЕЛЬ 3 ================= -->
  <rect x="648" y="52" width="288" height="330" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="792" y="78" text-anchor="middle" font-size="14.5" font-weight="600" fill="#991b1b">Пакет отброшен</text>

  <rect x="672" y="94" width="96" height="40" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="720" y="119" text-anchor="middle" font-size="12.5" fill="#0f172a">клиент</text>
  <rect x="816" y="94" width="96" height="40" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="864" y="119" text-anchor="middle" font-size="12.5" fill="#0f172a">хост</text>

  <line x1="720" y1="134" x2="720" y2="286" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="864" y1="134" x2="864" y2="286" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- стена фаервола -->
  <rect x="806" y="146" width="9" height="120" fill="#dc2626"/>
  <text x="810" y="284" text-anchor="middle" font-size="11" fill="#991b1b">фильтр</text>

  <text x="762" y="170" text-anchor="middle" font-size="12" fill="#334155">SYN</text>
  <line x1="720" y1="180" x2="802" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#aSlate)"/>
  <text x="838" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">✗</text>

  <text x="762" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">ответа нет вообще</text>
  <line x1="798" y1="232" x2="726" y2="232" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 5"/>
  <text x="762" y="268" text-anchor="middle" font-size="11.5" fill="#64748b">ждём таймаут</text>

  <rect x="668" y="298" width="248" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
  <text x="792" y="322" text-anchor="middle" font-size="12.5" fill="#991b1b" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">timed out</text>
  <text x="792" y="346" text-anchor="middle" font-size="12" fill="#334155">Фильтр, не тот адрес или хост мёртв</text>

  <text x="480" y="408" text-anchor="middle" font-size="13.5" fill="#0f172a">Отличать эти два отказа важнее, чем помнить флаги: «refused» и «timed out» чинятся в разных местах.</text>
  <text x="480" y="430" text-anchor="middle" font-size="12.5" fill="#64748b">Быстрый отказ — иди к процессу на хосте. Долгая тишина — иди к фаерволу, адресу и маршруту.</text>
</svg>
