<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444444"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#111111">tar.gz и zip складывают одни и те же файлы, но в разном порядке действий</text>

  <!-- ряд TAR -->
  <text x="20" y="66" font-size="14" font-weight="bold" fill="#1b3f66">TAR.GZ: сначала склеить, потом сжать поток целиком</text>

  <rect x="20" y="80" width="86" height="30" rx="4" fill="#eaf3ff" stroke="#2f6fb5" stroke-width="1.2"/>
  <text x="63" y="100" font-size="12" text-anchor="middle" fill="#1b3f66">readme.txt</text>
  <rect x="20" y="116" width="86" height="30" rx="4" fill="#eaf3ff" stroke="#2f6fb5" stroke-width="1.2"/>
  <text x="63" y="136" font-size="12" text-anchor="middle" fill="#1b3f66">meta.json</text>
  <rect x="20" y="152" width="86" height="30" rx="4" fill="#eaf3ff" stroke="#2f6fb5" stroke-width="1.2"/>
  <text x="63" y="172" font-size="12" text-anchor="middle" fill="#1b3f66">data.npy</text>

  <line x1="112" y1="131" x2="156" y2="131" stroke="#444444" stroke-width="2" marker-end="url(#a5)"/>
  <text x="134" y="122" font-size="11" text-anchor="middle" fill="#444444">tar</text>

  <rect x="160" y="96" width="250" height="70" rx="4" fill="#f4f4f4" stroke="#777777" stroke-width="1.5"/>
  <text x="285" y="90" font-size="12" text-anchor="middle" fill="#333333">один непрерывный поток байтов</text>
  <rect x="170" y="110" width="70" height="42" fill="#dfe9f5" stroke="#2f6fb5" stroke-width="1"/>
  <text x="205" y="136" font-size="11" text-anchor="middle" fill="#1b3f66">readme</text>
  <rect x="244" y="110" width="70" height="42" fill="#dfe9f5" stroke="#2f6fb5" stroke-width="1"/>
  <text x="279" y="136" font-size="11" text-anchor="middle" fill="#1b3f66">meta</text>
  <rect x="318" y="110" width="82" height="42" fill="#dfe9f5" stroke="#2f6fb5" stroke-width="1"/>
  <text x="359" y="136" font-size="11" text-anchor="middle" fill="#1b3f66">data</text>

  <line x1="416" y1="131" x2="460" y2="131" stroke="#444444" stroke-width="2" marker-end="url(#a5)"/>
  <text x="438" y="122" font-size="11" text-anchor="middle" fill="#444444">gzip</text>

  <rect x="464" y="96" width="170" height="70" rx="4" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="549" y="126" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d5c39">bundle.tar.gz</text>
  <text x="549" y="146" font-size="12" text-anchor="middle" fill="#1d5c39">сжат как единое целое</text>

  <text x="648" y="118" font-size="12" fill="#333333">чтобы достать meta.json,</text>
  <text x="648" y="136" font-size="12" fill="#333333">поток распаковывают</text>
  <text x="648" y="154" font-size="12" fill="#333333">подряд до этого места</text>

  <line x1="20" y1="200" x2="840" y2="200" stroke="#dddddd" stroke-width="1"/>

  <!-- ряд ZIP -->
  <text x="20" y="228" font-size="14" font-weight="bold" fill="#7a5405">ZIP: каждый файл сжимается отдельно, в конце — оглавление</text>

  <rect x="20" y="242" width="86" height="30" rx="4" fill="#eaf3ff" stroke="#2f6fb5" stroke-width="1.2"/>
  <text x="63" y="262" font-size="12" text-anchor="middle" fill="#1b3f66">readme.txt</text>
  <rect x="20" y="278" width="86" height="30" rx="4" fill="#eaf3ff" stroke="#2f6fb5" stroke-width="1.2"/>
  <text x="63" y="298" font-size="12" text-anchor="middle" fill="#1b3f66">meta.json</text>
  <rect x="20" y="314" width="86" height="30" rx="4" fill="#eaf3ff" stroke="#2f6fb5" stroke-width="1.2"/>
  <text x="63" y="334" font-size="12" text-anchor="middle" fill="#1b3f66">data.npy</text>

  <line x1="112" y1="293" x2="156" y2="293" stroke="#444444" stroke-width="2" marker-end="url(#a5)"/>
  <text x="134" y="284" font-size="11" text-anchor="middle" fill="#444444">zip</text>

  <rect x="160" y="258" width="474" height="70" rx="4" fill="#fdf3e2" stroke="#c58b1c" stroke-width="1.5"/>
  <rect x="170" y="272" width="100" height="42" fill="#f7e2b8" stroke="#c58b1c" stroke-width="1"/>
  <text x="220" y="292" font-size="11" text-anchor="middle" fill="#7a5405">readme</text>
  <text x="220" y="308" font-size="10" text-anchor="middle" fill="#7a5405">сжат сам по себе</text>
  <rect x="278" y="272" width="100" height="42" fill="#f7e2b8" stroke="#c58b1c" stroke-width="1"/>
  <text x="328" y="292" font-size="11" text-anchor="middle" fill="#7a5405">meta</text>
  <text x="328" y="308" font-size="10" text-anchor="middle" fill="#7a5405">сжат сам по себе</text>
  <rect x="386" y="272" width="100" height="42" fill="#f7e2b8" stroke="#c58b1c" stroke-width="1"/>
  <text x="436" y="292" font-size="11" text-anchor="middle" fill="#7a5405">data</text>
  <text x="436" y="308" font-size="10" text-anchor="middle" fill="#7a5405">сжат сам по себе</text>
  <rect x="494" y="272" width="130" height="42" fill="#e6d3f5" stroke="#7a4fb5" stroke-width="1"/>
  <text x="559" y="292" font-size="11" text-anchor="middle" fill="#43276b">оглавление:</text>
  <text x="559" y="308" font-size="10" text-anchor="middle" fill="#43276b">кто где лежит</text>

  <text x="648" y="280" font-size="12" fill="#333333">meta.json достают сразу</text>
  <text x="648" y="298" font-size="12" fill="#333333">по оглавлению, не читая</text>
  <text x="648" y="316" font-size="12" fill="#333333">соседние файлы</text>

  <text x="20" y="364" font-size="13" fill="#111111">TAR сам ничего не сжимает — сжатие делает gzip поверх готового потока.</text>
  <text x="20" y="385" font-size="13" fill="#111111">ZIP сжимает каждый файл отдельно и потому удобнее, когда нужен один участник из большого архива.</text>
</svg>
