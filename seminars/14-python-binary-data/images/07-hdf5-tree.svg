<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="system-ui, Arial, sans-serif">
  <rect x="0" y="0" width="840" height="360" fill="#ffffff"/>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444444"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#111111">HDF5: один файл — целое дерево внутри</text>

  <!-- корень -->
  <rect x="30" y="56" width="190" height="52" rx="6" fill="#eaf3ff" stroke="#2f6fb5" stroke-width="1.5"/>
  <text x="125" y="78" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b3f66">measurements.h5</text>
  <text x="125" y="97" font-size="12" text-anchor="middle" fill="#1b3f66">корень «/» — как каталог</text>

  <!-- атрибут корня -->
  <rect x="248" y="56" width="316" height="52" rx="6" fill="#f3eaff" stroke="#7a4fb5" stroke-width="1.5"/>
  <text x="406" y="78" font-size="13" text-anchor="middle" fill="#43276b">attribute: description = "Учебные измерения"</text>
  <text x="406" y="97" font-size="12" text-anchor="middle" fill="#43276b">маленькая подпись рядом с данными</text>
  <line x1="222" y1="82" x2="246" y2="82" stroke="#444444" stroke-width="1.5" marker-end="url(#a4)"/>

  <!-- группа -->
  <line x1="60" y1="110" x2="60" y2="150" stroke="#2f6fb5" stroke-width="1.5"/>
  <line x1="60" y1="150" x2="86" y2="150" stroke="#2f6fb5" stroke-width="1.5"/>
  <rect x="90" y="126" width="212" height="48" rx="6" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="196" y="146" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d5c39">group: experiment</text>
  <text x="196" y="164" font-size="12" text-anchor="middle" fill="#1d5c39">объединяет связанные данные</text>

  <!-- датасет -->
  <line x1="120" y1="176" x2="120" y2="218" stroke="#2e8b57" stroke-width="1.5"/>
  <line x1="120" y1="218" x2="146" y2="218" stroke="#2e8b57" stroke-width="1.5"/>
  <rect x="150" y="192" width="210" height="52" rx="6" fill="#fdf3e2" stroke="#c58b1c" stroke-width="1.5"/>
  <text x="255" y="213" font-size="14" font-weight="bold" text-anchor="middle" fill="#7a5405">dataset: values</text>
  <text x="255" y="232" font-size="11" text-anchor="middle" fill="#7a5405">(100, 3) float32, блок (20, 3)</text>

  <!-- атрибут датасета -->
  <rect x="390" y="192" width="180" height="52" rx="6" fill="#f3eaff" stroke="#7a4fb5" stroke-width="1.5"/>
  <text x="480" y="215" font-size="13" text-anchor="middle" fill="#43276b">attribute: units = "mV"</text>
  <text x="480" y="234" font-size="12" text-anchor="middle" fill="#43276b">в чём измеряли</text>
  <line x1="362" y1="218" x2="386" y2="218" stroke="#444444" stroke-width="1.5" marker-end="url(#a4)"/>

  <!-- путь и чтение среза -->
  <rect x="600" y="126" width="215" height="118" rx="6" fill="#f4f4f4" stroke="#777777" stroke-width="1.5"/>
  <text x="707" y="150" font-size="13" font-weight="bold" text-anchor="middle" fill="#333333">полный путь внутри файла</text>
  <text x="707" y="174" font-size="13" text-anchor="middle" fill="#1b3f66">file["experiment/values"]</text>
  <text x="707" y="200" font-size="12" text-anchor="middle" fill="#333333">срез читает нужные строки,</text>
  <text x="707" y="218" font-size="12" text-anchor="middle" fill="#333333">весь dataset на диске:</text>
  <text x="707" y="236" font-size="13" text-anchor="middle" fill="#1d5c39">dataset[10:13]</text>

  <text x="20" y="300" font-size="13" fill="#111111">Группа — «каталог», dataset — массив, который остаётся на диске, attribute — короткое описание рядом с данными.</text>
  <text x="20" y="322" font-size="13" fill="#111111">Поэтому один .h5 заменяет каталог из десятка .npy и отдельного файла с метаданными.</text>
</svg>
