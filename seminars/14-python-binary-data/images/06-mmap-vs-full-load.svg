<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" font-family="system-ui, Arial, sans-serif">
  <rect x="0" y="0" width="840" height="350" fill="#ffffff"/>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444444"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#111111">Нужны строки 1000–1999 из файла на 20 ГБ</text>

  <!-- слева: обычная загрузка -->
  <text x="30" y="62" font-size="14" font-weight="bold" fill="#8c2519">np.load(path)</text>

  <rect x="30" y="74" width="110" height="200" fill="#eaf3ff" stroke="#2f6fb5" stroke-width="1.5"/>
  <text x="85" y="94" font-size="12" text-anchor="middle" fill="#1b3f66">features.npy</text>
  <text x="85" y="112" font-size="12" text-anchor="middle" fill="#1b3f66">20 ГБ на диске</text>
  <rect x="40" y="150" width="90" height="26" fill="#f6c85f" stroke="#c58b1c" stroke-width="1"/>
  <text x="85" y="167" font-size="10" text-anchor="middle" fill="#7a5405">строки 1000–1999</text>

  <line x1="146" y1="174" x2="212" y2="174" stroke="#444444" stroke-width="2" marker-end="url(#a3)"/>
  <text x="179" y="164" font-size="11" text-anchor="middle" fill="#444444">всё</text>

  <rect x="216" y="74" width="150" height="200" fill="#fdeceb" stroke="#c0392b" stroke-width="1.5"/>
  <text x="291" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#8c2519">оперативная память</text>
  <rect x="228" y="110" width="126" height="150" fill="#f7bcb6" stroke="#c0392b" stroke-width="1"/>
  <text x="291" y="180" font-size="12" text-anchor="middle" fill="#8c2519">все 20 ГБ</text>
  <text x="291" y="200" font-size="11" text-anchor="middle" fill="#8c2519">(скорее всего не влезут)</text>

  <!-- разделитель -->
  <line x1="400" y1="50" x2="400" y2="290" stroke="#dddddd" stroke-width="1"/>

  <!-- справа: mmap -->
  <text x="430" y="62" font-size="14" font-weight="bold" fill="#1d5c39">np.load(path, mmap_mode="r")[1000:2000]</text>

  <rect x="430" y="74" width="110" height="200" fill="#eaf3ff" stroke="#2f6fb5" stroke-width="1.5"/>
  <text x="485" y="94" font-size="12" text-anchor="middle" fill="#1b3f66">features.npy</text>
  <text x="485" y="112" font-size="12" text-anchor="middle" fill="#1b3f66">20 ГБ на диске</text>
  <rect x="440" y="150" width="90" height="26" fill="#f6c85f" stroke="#c58b1c" stroke-width="1"/>
  <text x="485" y="167" font-size="10" text-anchor="middle" fill="#7a5405">строки 1000–1999</text>

  <line x1="546" y1="164" x2="612" y2="164" stroke="#444444" stroke-width="2" marker-end="url(#a3)"/>
  <text x="579" y="154" font-size="11" text-anchor="middle" fill="#444444">срез</text>

  <rect x="616" y="74" width="150" height="200" fill="#e8f6ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="691" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d5c39">оперативная память</text>
  <rect x="628" y="150" width="126" height="26" fill="#9fd8b4" stroke="#2e8b57" stroke-width="1"/>
  <text x="691" y="168" font-size="11" text-anchor="middle" fill="#1d5c39">только 1000 строк</text>
  <text x="691" y="206" font-size="12" text-anchor="middle" fill="#1d5c39">остальное осталось</text>
  <text x="691" y="224" font-size="12" text-anchor="middle" fill="#1d5c39">на диске</text>

  <text x="20" y="320" font-size="13" fill="#111111">mmap_mode="r" не читает файл целиком: в память попадают только те участки, к которым вы обратились срезом.</text>
</svg>
