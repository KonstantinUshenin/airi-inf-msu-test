<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="940" height="400" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">axis — это та ось, которая пропадает</text>
  <text x="470" y="58" text-anchor="middle" font-size="14" fill="#475569" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace">M = np.arange(6).reshape(2, 3)</text>

  <line x1="470" y1="76" x2="470" y2="330" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ── axis=0 ── -->
  <text x="235" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#1d4ed8">M.sum(axis=0) — по столбцам</text>

  <g font-size="17" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace">
    <rect x="110" y="126" width="168" height="92" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <line x1="166" y1="126" x2="166" y2="218" stroke="#475569" stroke-width="1.5"/>
    <line x1="222" y1="126" x2="222" y2="218" stroke="#475569" stroke-width="1.5"/>
    <line x1="110" y1="172" x2="278" y2="172" stroke="#475569" stroke-width="1.5"/>
    <text x="138" y="156" text-anchor="middle" fill="#0f172a">0</text>
    <text x="194" y="156" text-anchor="middle" fill="#0f172a">1</text>
    <text x="250" y="156" text-anchor="middle" fill="#0f172a">2</text>
    <text x="138" y="202" text-anchor="middle" fill="#0f172a">3</text>
    <text x="194" y="202" text-anchor="middle" fill="#0f172a">4</text>
    <text x="250" y="202" text-anchor="middle" fill="#0f172a">5</text>
  </g>

  <line x1="92" y1="128" x2="92" y2="216" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ax)"/>
  <text transform="rotate(-90 76 172)" x="76" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">ось 0</text>

  <g stroke="#1d4ed8" stroke-width="2">
    <line x1="138" y1="222" x2="138" y2="250" marker-end="url(#ax)"/>
    <line x1="194" y1="222" x2="194" y2="250" marker-end="url(#ax)"/>
    <line x1="250" y1="222" x2="250" y2="250" marker-end="url(#ax)"/>
  </g>

  <g font-size="17" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace">
    <rect x="110" y="256" width="168" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="166" y1="256" x2="166" y2="302" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="222" y1="256" x2="222" y2="302" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="138" y="286" text-anchor="middle" fill="#0f172a">3</text>
    <text x="194" y="286" text-anchor="middle" fill="#0f172a">5</text>
    <text x="250" y="286" text-anchor="middle" fill="#0f172a">7</text>
  </g>

  <text x="235" y="330" text-anchor="middle" font-size="15" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace">(2, 3)  →  (3,)</text>

  <!-- ── axis=1 ── -->
  <text x="705" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#b45309">M.sum(axis=1) — по строкам</text>

  <g font-size="17" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace">
    <rect x="560" y="126" width="168" height="92" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <line x1="616" y1="126" x2="616" y2="218" stroke="#475569" stroke-width="1.5"/>
    <line x1="672" y1="126" x2="672" y2="218" stroke="#475569" stroke-width="1.5"/>
    <line x1="560" y1="172" x2="728" y2="172" stroke="#475569" stroke-width="1.5"/>
    <text x="588" y="156" text-anchor="middle" fill="#0f172a">0</text>
    <text x="644" y="156" text-anchor="middle" fill="#0f172a">1</text>
    <text x="700" y="156" text-anchor="middle" fill="#0f172a">2</text>
    <text x="588" y="202" text-anchor="middle" fill="#0f172a">3</text>
    <text x="644" y="202" text-anchor="middle" fill="#0f172a">4</text>
    <text x="700" y="202" text-anchor="middle" fill="#0f172a">5</text>
  </g>

  <line x1="562" y1="116" x2="726" y2="116" stroke="#b45309" stroke-width="2" marker-end="url(#ay)"/>
  <text x="644" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">ось 1</text>

  <g stroke="#b45309" stroke-width="2">
    <line x1="734" y1="149" x2="768" y2="149" marker-end="url(#ay)"/>
    <line x1="734" y1="195" x2="768" y2="195" marker-end="url(#ay)"/>
  </g>

  <g font-size="17" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace">
    <rect x="776" y="126" width="70" height="92" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <line x1="776" y1="172" x2="846" y2="172" stroke="#b45309" stroke-width="1.5"/>
    <text x="811" y="156" text-anchor="middle" fill="#0f172a">3</text>
    <text x="811" y="202" text-anchor="middle" fill="#0f172a">12</text>
  </g>

  <text x="705" y="330" text-anchor="middle" font-size="15" fill="#0f172a" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace">(2, 3)  →  (2,)</text>

  <text x="470" y="372" text-anchor="middle" font-size="14" fill="#334155">Складывают <tspan font-weight="600">вдоль</tspan> указанной оси: её элементы схлопываются в один, и в форме результата этой оси больше нет.</text>
</svg>
