<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrJ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1080" height="600" fill="#ffffff"/>
  <text x="540" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">merge: что делает how с несовпавшими строками</text>

  <!-- ===== исходные таблицы ===== -->
  <text x="245" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">runs — запуски (левая)</text>
  <g font-size="14" fill="#0f172a">
    <rect x="120" y="72" width="250" height="28" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <text x="165" y="91" text-anchor="middle" font-size="13" font-weight="600">run_id</text>
    <text x="290" y="91" text-anchor="middle" font-size="13" font-weight="600">model</text>

    <rect x="120" y="100" width="250" height="30" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/>
    <text x="165" y="121" text-anchor="middle">r01</text>
    <text x="290" y="121" text-anchor="middle">resnet18</text>

    <rect x="120" y="130" width="250" height="30" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/>
    <text x="165" y="151" text-anchor="middle">r04</text>
    <text x="290" y="151" text-anchor="middle">resnet50</text>

    <rect x="120" y="160" width="250" height="30" fill="#fef3c7" stroke="#94a3b8" stroke-width="1"/>
    <text x="165" y="181" text-anchor="middle">r12</text>
    <text x="290" y="181" text-anchor="middle">mobilenet_v3</text>
  </g>
  <text x="245" y="208" text-anchor="middle" font-size="12" fill="#b45309">mobilenet_v3 в справочнике нет</text>

  <text x="835" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">models — справочник (правая)</text>
  <g font-size="14" fill="#0f172a">
    <rect x="710" y="72" width="250" height="28" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <text x="775" y="91" text-anchor="middle" font-size="13" font-weight="600">model</text>
    <text x="905" y="91" text-anchor="middle" font-size="13" font-weight="600">family</text>

    <rect x="710" y="100" width="250" height="30" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/>
    <text x="775" y="121" text-anchor="middle">resnet18</text>
    <text x="905" y="121" text-anchor="middle">cnn</text>

    <rect x="710" y="130" width="250" height="30" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/>
    <text x="775" y="151" text-anchor="middle">resnet50</text>
    <text x="905" y="151" text-anchor="middle">cnn</text>

    <rect x="710" y="160" width="250" height="30" fill="#e9d5ff" stroke="#94a3b8" stroke-width="1"/>
    <text x="775" y="181" text-anchor="middle">efficientnet_b0</text>
    <text x="905" y="181" text-anchor="middle">cnn</text>
  </g>
  <text x="835" y="208" text-anchor="middle" font-size="12" fill="#7e22ce">efficientnet_b0 ни разу не запускали</text>

  <text x="540" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">ключ склейки</text>
  <text x="540" y="140" text-anchor="middle" font-size="14" fill="#334155">on="model"</text>
  <line x1="450" y1="128" x2="376" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arrJ)"/>
  <line x1="630" y1="128" x2="704" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arrJ)"/>

  <!-- ===== результаты ===== -->
  <rect x="20" y="234" width="330" height="270" rx="10" fill="#f8fafc" stroke="#166534" stroke-width="2"/>
  <text x="185" y="260" text-anchor="middle" font-size="16" font-weight="600" fill="#166534">how="left"</text>
  <text x="185" y="280" text-anchor="middle" font-size="12" fill="#64748b">все строки левой таблицы</text>
  <g font-size="13" fill="#0f172a">
    <rect x="40" y="292" width="290" height="26" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <text x="80" y="310" text-anchor="middle" font-size="12" font-weight="600">run_id</text>
    <text x="185" y="310" text-anchor="middle" font-size="12" font-weight="600">model</text>
    <text x="295" y="310" text-anchor="middle" font-size="12" font-weight="600">family</text>

    <rect x="40" y="318" width="290" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="337" text-anchor="middle">r01</text>
    <text x="185" y="337" text-anchor="middle">resnet18</text>
    <text x="295" y="337" text-anchor="middle">cnn</text>

    <rect x="40" y="346" width="290" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="365" text-anchor="middle">r04</text>
    <text x="185" y="365" text-anchor="middle">resnet50</text>
    <text x="295" y="365" text-anchor="middle">cnn</text>

    <rect x="40" y="374" width="290" height="28" fill="#fef3c7" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="393" text-anchor="middle">r12</text>
    <text x="185" y="393" text-anchor="middle">mobilenet_v3</text>
    <text x="295" y="393" text-anchor="middle" fill="#b91c1c" font-weight="600">NaN</text>
  </g>
  <text x="185" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">3 строки из 3 — ничего не потеряли</text>
  <text x="185" y="456" text-anchor="middle" font-size="12" fill="#334155">пропуск виден и считается:</text>
  <text x="185" y="476" text-anchor="middle" font-size="12" fill="#334155">joined["family"].isna().sum()</text>

  <rect x="375" y="234" width="330" height="270" rx="10" fill="#f8fafc" stroke="#b91c1c" stroke-width="2"/>
  <text x="540" y="260" text-anchor="middle" font-size="16" font-weight="600" fill="#b91c1c">how="inner"</text>
  <text x="540" y="280" text-anchor="middle" font-size="12" fill="#64748b">только совпавшие по ключу</text>
  <g font-size="13" fill="#0f172a">
    <rect x="395" y="292" width="290" height="26" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <text x="435" y="310" text-anchor="middle" font-size="12" font-weight="600">run_id</text>
    <text x="540" y="310" text-anchor="middle" font-size="12" font-weight="600">model</text>
    <text x="650" y="310" text-anchor="middle" font-size="12" font-weight="600">family</text>

    <rect x="395" y="318" width="290" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="435" y="337" text-anchor="middle">r01</text>
    <text x="540" y="337" text-anchor="middle">resnet18</text>
    <text x="650" y="337" text-anchor="middle">cnn</text>

    <rect x="395" y="346" width="290" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="435" y="365" text-anchor="middle">r04</text>
    <text x="540" y="365" text-anchor="middle">resnet50</text>
    <text x="650" y="365" text-anchor="middle">cnn</text>

    <rect x="395" y="374" width="290" height="28" fill="#fee2e2" stroke="#b91c1c" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="540" y="393" text-anchor="middle" font-size="12" fill="#b91c1c">строка r12 выброшена целиком</text>
  </g>
  <text x="540" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">2 строки из 3 — потеря молча</text>
  <text x="540" y="456" text-anchor="middle" font-size="12" fill="#334155">новых NaN нет, зато нет и запуска:</text>
  <text x="540" y="476" text-anchor="middle" font-size="12" fill="#334155">заметить можно только по shape</text>

  <rect x="730" y="234" width="330" height="270" rx="10" fill="#f8fafc" stroke="#7e22ce" stroke-width="2"/>
  <text x="895" y="260" text-anchor="middle" font-size="16" font-weight="600" fill="#7e22ce">how="outer"</text>
  <text x="895" y="280" text-anchor="middle" font-size="12" fill="#64748b">все строки обеих таблиц</text>
  <g font-size="13" fill="#0f172a">
    <rect x="750" y="292" width="290" height="26" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <text x="790" y="310" text-anchor="middle" font-size="12" font-weight="600">run_id</text>
    <text x="895" y="310" text-anchor="middle" font-size="12" font-weight="600">model</text>
    <text x="1005" y="310" text-anchor="middle" font-size="12" font-weight="600">family</text>

    <rect x="750" y="318" width="290" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="790" y="335" text-anchor="middle" font-size="12">r01</text>
    <text x="895" y="335" text-anchor="middle" font-size="12">resnet18</text>
    <text x="1005" y="335" text-anchor="middle" font-size="12">cnn</text>

    <rect x="750" y="342" width="290" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="790" y="359" text-anchor="middle" font-size="12">r04</text>
    <text x="895" y="359" text-anchor="middle" font-size="12">resnet50</text>
    <text x="1005" y="359" text-anchor="middle" font-size="12">cnn</text>

    <rect x="750" y="366" width="290" height="24" fill="#fef3c7" stroke="#94a3b8" stroke-width="1"/>
    <text x="790" y="383" text-anchor="middle" font-size="12">r12</text>
    <text x="895" y="383" text-anchor="middle" font-size="12">mobilenet_v3</text>
    <text x="1005" y="383" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="600">NaN</text>

    <rect x="750" y="390" width="290" height="24" fill="#e9d5ff" stroke="#94a3b8" stroke-width="1"/>
    <text x="790" y="407" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="600">NaN</text>
    <text x="895" y="407" text-anchor="middle" font-size="12">efficientnet_b0</text>
    <text x="1005" y="407" text-anchor="middle" font-size="12">cnn</text>
  </g>
  <text x="895" y="440" text-anchor="middle" font-size="13" font-weight="600" fill="#7e22ce">4 строки — появилась лишняя</text>
  <text x="895" y="464" text-anchor="middle" font-size="12" fill="#334155">пропуски приходят с обеих сторон:</text>
  <text x="895" y="484" text-anchor="middle" font-size="12" fill="#334155">строка есть, а запуска за ней нет</text>

  <text x="540" y="540" text-anchor="middle" font-size="14" fill="#0f172a">how решает судьбу несовпавших: left оставляет их с пропусками, inner молча выбрасывает, outer тащит и лишние строки справа.</text>
  <text x="540" y="568" text-anchor="middle" font-size="13" fill="#64748b">По умолчанию берите how="left" и сразу считайте isna().sum() по новым столбцам — это ответ на вопрос «кому справочник не помог»</text>
</svg>
