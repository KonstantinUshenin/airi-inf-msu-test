<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Безопасный и идемпотентный — это два разных свойства</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#64748b">безопасный = только читает · идемпотентный = повтор не меняет итогового состояния</text>

  <!-- заголовки столбцов -->
  <text x="420" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">идемпотентный: да</text>
  <text x="700" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">идемпотентный: нет</text>

  <!-- заголовки строк -->
  <text x="150" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">безопасный: да</text>
  <text x="150" y="182" text-anchor="middle" font-size="13" fill="#64748b">(ничего не меняет)</text>
  <text x="150" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">безопасный: нет</text>
  <text x="150" y="322" text-anchor="middle" font-size="13" fill="#64748b">(меняет состояние)</text>

  <!-- клетка 1: safe + idempotent -->
  <rect x="282" y="104" width="276" height="130" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="420" y="140" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">GET · HEAD · OPTIONS</text>
  <text x="420" y="168" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">QUERY · TRACE</text>
  <text x="420" y="200" text-anchor="middle" font-size="13" fill="#166534">оборвалось соединение —</text>
  <text x="420" y="219" text-anchor="middle" font-size="13" fill="#166534">повторяем автоматически</text>

  <!-- клетка 2: safe + not idempotent (пустая) -->
  <rect x="574" y="104" width="276" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="712" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#64748b">клетка пустая</text>
  <text x="712" y="180" text-anchor="middle" font-size="13" fill="#64748b">метод, который ничего не меняет,</text>
  <text x="712" y="199" text-anchor="middle" font-size="13" fill="#64748b">нельзя «сломать» повтором —</text>
  <text x="712" y="218" text-anchor="middle" font-size="13" fill="#64748b">безопасный всегда идемпотентен</text>

  <!-- клетка 3: unsafe + idempotent -->
  <rect x="282" y="248" width="276" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="420" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#7c2d12">PUT · DELETE</text>
  <text x="420" y="322" text-anchor="middle" font-size="13" fill="#92400e">второй DELETE не удалит «ещё раз»:</text>
  <text x="420" y="341" text-anchor="middle" font-size="13" fill="#92400e">состояние то же, а ответ может</text>
  <text x="420" y="360" text-anchor="middle" font-size="13" fill="#92400e">отличаться — 404 вместо 204</text>

  <!-- клетка 4: unsafe + not idempotent -->
  <rect x="574" y="248" width="276" height="130" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="712" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#7f1d1d">POST · PATCH · CONNECT</text>
  <text x="712" y="322" text-anchor="middle" font-size="13" fill="#991b1b">повтор создаёт второй объект</text>
  <text x="712" y="341" text-anchor="middle" font-size="13" fill="#991b1b">или запускает действие дважды —</text>
  <text x="712" y="360" text-anchor="middle" font-size="13" fill="#991b1b">сам не повторяй</text>

  <text x="450" y="410" text-anchor="middle" font-size="13.5" fill="#0f172a">Правило курса: повторять запрос можно только из зелёной и жёлтой клеток; красную повторяет человек, а не программа</text>
</svg>
