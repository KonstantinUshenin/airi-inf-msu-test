<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">grep и find ищут разное</text>

  <rect x="30" y="60" width="430" height="290" rx="10" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="245" y="88" text-anchor="middle" font-size="15" fill="#166534" font-weight="600">grep -rn TODO project/</text>
  <text x="245" y="110" text-anchor="middle" font-size="13" fill="#334155">смотрит ВНУТРЬ файлов</text>
  <rect x="60" y="130" width="180" height="118" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="150" y="152" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">train.py</text>
  <text x="150" y="178" text-anchor="middle" font-size="11" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">import sys</text>
  <rect x="68" y="186" width="164" height="20" rx="4" fill="#dcfce7" stroke="#166534" stroke-width="1"/>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"># TODO: значения</text>
  <text x="150" y="222" text-anchor="middle" font-size="11" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">def main():</text>
  <rect x="270" y="130" width="180" height="118" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="360" y="152" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">model.py</text>
  <text x="360" y="178" text-anchor="middle" font-size="11" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">class Model:</text>
  <text x="360" y="200" text-anchor="middle" font-size="11" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">    pass</text>
  <text x="245" y="285" text-anchor="middle" font-size="13" fill="#166534" font-weight="600">нашёл: train.py:2</text>
  <text x="245" y="312" text-anchor="middle" font-size="12" fill="#64748b">содержимое каждого файла прочитано</text>
  <rect x="500" y="60" width="430" height="290" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="715" y="88" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="600">find project -name '*.py'</text>
  <text x="715" y="110" text-anchor="middle" font-size="13" fill="#334155">смотрит на СВОЙСТВА файлов</text>
  <rect x="530" y="130" width="180" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="620" y="160" text-anchor="middle" font-size="13" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">train.py</text>
  <rect x="740" y="130" width="180" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="830" y="160" text-anchor="middle" font-size="13" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">model.py</text>
  <rect x="530" y="196" width="180" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="620" y="226" text-anchor="middle" font-size="13" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">notes.txt</text>
  <rect x="740" y="196" width="180" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="226" text-anchor="middle" font-size="13" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data.csv</text>
  <text x="715" y="285" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="600">нашёл: train.py, model.py</text>
  <text x="715" y="312" text-anchor="middle" font-size="12" fill="#64748b">файлы не открывались — хватило имени</text>

  <text x="480" y="384" text-anchor="middle" font-size="13" fill="#64748b">grep отвечает «в каких файлах есть такой текст», find — «какие файлы подходят по имени, размеру, дате»</text>
</svg>
