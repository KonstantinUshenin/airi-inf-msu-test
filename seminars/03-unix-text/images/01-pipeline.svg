<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1080" height="330" fill="#ffffff"/>
  <text x="540" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Конвейер: sort | uniq -c | sort</text>

  <rect x="20" y="92" width="176" height="62" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="108" y="116" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="600">students.csv</text>
  <text x="108" y="137" text-anchor="middle" font-size="12" fill="#64748b">исходные строки</text>
  <rect x="20" y="178" width="176" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="108" y="202" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Anna,ML-02,87</text>
  <text x="108" y="222" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Boris,ML-01,64</text>
  <text x="108" y="242" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Vera,ML-02,93</text>
  <rect x="236" y="92" width="176" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="324" y="116" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="600">cut -d, -f2</text>
  <text x="324" y="137" text-anchor="middle" font-size="12" fill="#64748b">оставить колонку</text>
  <rect x="236" y="178" width="176" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="324" y="202" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ML-02</text>
  <text x="324" y="222" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ML-01</text>
  <text x="324" y="242" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ML-02</text>
  <line x1="202" y1="123" x2="228" y2="123" stroke="#166534" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="216" y="111" text-anchor="middle" font-size="17" fill="#166534" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|</text>
  <rect x="452" y="92" width="176" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="540" y="116" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="600">sort</text>
  <text x="540" y="137" text-anchor="middle" font-size="12" fill="#64748b">поставить рядом</text>
  <rect x="452" y="178" width="176" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540" y="202" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ML-01</text>
  <text x="540" y="222" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ML-02</text>
  <text x="540" y="242" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ML-02</text>
  <line x1="418" y1="123" x2="444" y2="123" stroke="#166534" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="432" y="111" text-anchor="middle" font-size="17" fill="#166534" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|</text>
  <rect x="668" y="92" width="176" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="756" y="116" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="600">uniq -c</text>
  <text x="756" y="137" text-anchor="middle" font-size="12" fill="#64748b">схлопнуть соседей</text>
  <rect x="668" y="178" width="176" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="756" y="202" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1 ML-01</text>
  <text x="756" y="222" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2 ML-02</text>
  <line x1="634" y1="123" x2="660" y2="123" stroke="#166534" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="648" y="111" text-anchor="middle" font-size="17" fill="#166534" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|</text>
  <rect x="884" y="92" width="176" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="972" y="116" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="600">sort -k1,1nr</text>
  <text x="972" y="137" text-anchor="middle" font-size="12" fill="#64748b">по убыванию числа</text>
  <rect x="884" y="178" width="176" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="972" y="202" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2 ML-02</text>
  <text x="972" y="222" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1 ML-01</text>
  <line x1="850" y1="123" x2="876" y2="123" stroke="#166534" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="864" y="111" text-anchor="middle" font-size="17" fill="#166534" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|</text>

  <text x="540" y="314" text-anchor="middle" font-size="13" fill="#64748b">Каждая программа читает поток, делает одно действие и передаёт результат дальше — промежуточные файлы не нужны</text>
</svg>
