<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Почему -print0 и xargs -0</text>

  <rect x="280" y="54" width="400" height="44" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="480" y="82" text-anchor="middle" font-size="15" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data/old data.csv</text>
  <text x="480" y="116" text-anchor="middle" font-size="13" fill="#64748b">в имени файла есть пробел</text>
  <line x1="420" y1="128" x2="250" y2="172" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="540" y1="128" x2="710" y2="172" stroke="#166534" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="30" y="180" width="420" height="170" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="240" y="208" text-anchor="middle" font-size="15" fill="#b91c1c" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">| xargs</text>
  <text x="240" y="230" text-anchor="middle" font-size="12" fill="#64748b">разделитель — пробел</text>
  <rect x="60" y="248" width="170" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <text x="145" y="273" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data/old</text>
  <rect x="250" y="248" width="170" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <text x="335" y="273" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data.csv</text>
  <text x="240" y="315" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="600">два несуществующих пути</text>
  <text x="240" y="336" text-anchor="middle" font-size="12" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">wc: No such file or directory</text>
  <rect x="510" y="180" width="420" height="170" rx="10" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="720" y="208" text-anchor="middle" font-size="15" fill="#166534" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-print0 | xargs -0</text>
  <text x="720" y="230" text-anchor="middle" font-size="12" fill="#64748b">разделитель — нулевой байт</text>
  <rect x="560" y="248" width="320" height="40" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1"/>
  <text x="720" y="273" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data/old data.csv\0</text>
  <text x="720" y="315" text-anchor="middle" font-size="13" fill="#166534" font-weight="600">путь остался одним аргументом</text>
  <text x="720" y="336" text-anchor="middle" font-size="12" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">9 total</text>

  <text x="480" y="384" text-anchor="middle" font-size="13" fill="#64748b">Разделителем берут символ, который в имени файла встретиться не может, — нулевой байт</text>
</svg>
