<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="370" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">free -h: почему смотреть надо не на free</text>

  <text x="60" y="78" text-anchor="start" font-size="14" fill="#0f172a" font-weight="600">Оперативная память, total</text>
  <rect x="60" y="92" width="352" height="70" rx="6" fill="#ffedd5" stroke="#b45309" stroke-width="2"/>
  <text x="236" y="122" text-anchor="middle" font-size="14" fill="#b45309" font-weight="600">used</text>
  <text x="236" y="143" text-anchor="middle" font-size="11" fill="#64748b">занято программами</text>
  <rect x="412" y="92" width="319" height="70" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="571" y="122" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="600">buff/cache</text>
  <text x="571" y="143" text-anchor="middle" font-size="11" fill="#64748b">кэш прочитанных файлов</text>
  <rect x="731" y="92" width="168" height="70" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="815" y="122" text-anchor="middle" font-size="14" fill="#166534" font-weight="600">free</text>
  <text x="815" y="143" text-anchor="middle" font-size="11" fill="#64748b">не тронуто</text>
  <line x1="412" y1="186" x2="900" y2="186" stroke="#166534" stroke-width="3"/>
  <line x1="412" y1="178" x2="412" y2="194" stroke="#166534" stroke-width="3"/>
  <line x1="900" y1="178" x2="900" y2="194" stroke="#166534" stroke-width="3"/>
  <text x="656" y="212" text-anchor="middle" font-size="13" fill="#166534" font-weight="600">available — столько реально может занять новая программа</text>
  <text x="656" y="232" text-anchor="middle" font-size="12" fill="#64748b">ядро отдаст кэш по первому требованию</text>
  <rect x="60" y="258" width="840" height="58" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="480" y="282" text-anchor="middle" font-size="14" fill="#b91c1c" font-weight="600">swap — вытеснение страниц на диск</text>
  <text x="480" y="302" text-anchor="middle" font-size="12" fill="#64748b">обучение не падает, а замедляется в сотни раз</text>

  <text x="480" y="354" text-anchor="middle" font-size="13" fill="#64748b">Маленький free при большом available — нормальное состояние системы, тревожит нулевой available и растущий swap</text>
</svg>
