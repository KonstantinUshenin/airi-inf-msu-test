<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="330" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Сокеты, ядра и потоки</text>

  <rect x="40" y="66" width="560" height="210" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="320" y="92" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="600">Сокет (физический процессор)</text>
  <rect x="70" y="110" width="160" height="140" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="150" y="136" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="600">Ядро 1</text>
  <text x="150" y="156" text-anchor="middle" font-size="11" fill="#64748b">исполняет команды</text>
  <rect x="82" y="172" width="64" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="114" y="196" text-anchor="middle" font-size="11" fill="#1d4ed8">поток</text>
  <text x="114" y="216" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cpu0</text>
  <rect x="156" y="172" width="64" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="188" y="196" text-anchor="middle" font-size="11" fill="#1d4ed8">поток</text>
  <text x="188" y="216" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cpu1</text>
  <rect x="250" y="110" width="160" height="140" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="330" y="136" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="600">Ядро 2</text>
  <text x="330" y="156" text-anchor="middle" font-size="11" fill="#64748b">исполняет команды</text>
  <rect x="262" y="172" width="64" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="294" y="196" text-anchor="middle" font-size="11" fill="#1d4ed8">поток</text>
  <text x="294" y="216" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cpu2</text>
  <rect x="336" y="172" width="64" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="368" y="196" text-anchor="middle" font-size="11" fill="#1d4ed8">поток</text>
  <text x="368" y="216" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cpu3</text>
  <rect x="430" y="110" width="160" height="140" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="510" y="136" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="600">Ядро 3</text>
  <text x="510" y="156" text-anchor="middle" font-size="11" fill="#64748b">исполняет команды</text>
  <rect x="442" y="172" width="64" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="474" y="196" text-anchor="middle" font-size="11" fill="#1d4ed8">поток</text>
  <text x="474" y="216" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cpu4</text>
  <rect x="516" y="172" width="64" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="548" y="196" text-anchor="middle" font-size="11" fill="#1d4ed8">поток</text>
  <text x="548" y="216" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cpu5</text>
  <text x="320" y="268" text-anchor="middle" font-size="13" fill="#334155">3 ядра × 2 потока = 6 логических процессоров</text>
  <rect x="650" y="100" width="270" height="60" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="785" y="126" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lscpu</text>
  <text x="785" y="146" text-anchor="middle" font-size="12" fill="#64748b">Core(s) per socket: 3</text>
  <rect x="650" y="186" width="270" height="74" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="785" y="212" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">nproc</text>
  <text x="785" y="232" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="600">6</text>
  <text x="785" y="250" text-anchor="middle" font-size="11" fill="#64748b">считает потоки, не ядра</text>

  <text x="480" y="314" text-anchor="middle" font-size="13" fill="#64748b">num_workers считают от числа физических ядер: два потока делят один набор исполнительных блоков</text>
</svg>
