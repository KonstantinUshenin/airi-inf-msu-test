<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Почему хэш, а не «версия 1, 2, 3»</text>

  <g font-family="ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Consolas, monospace">
    <!-- коммит 1 -->
    <rect x="40" y="70" width="240" height="130" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="160" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">405ce41</text>
    <line x1="56" y1="112" x2="264" y2="112" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="136" font-size="12" fill="#64748b">родитель: —</text>
    <text x="60" y="160" font-size="12" fill="#334155">train.py</text>
    <text x="60" y="182" font-size="12" fill="#334155">«baseline»</text>

    <!-- коммит 2 -->
    <rect x="330" y="70" width="240" height="130" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="450" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">05cf497</text>
    <line x1="346" y1="112" x2="554" y2="112" stroke="#cbd5e1" stroke-width="1"/>
    <text x="350" y="136" font-size="12" fill="#b45309">родитель: 405ce41</text>
    <text x="350" y="160" font-size="12" fill="#334155">train.py</text>
    <text x="350" y="182" font-size="12" fill="#334155">«accuracy 0.95»</text>

    <!-- коммит 3 -->
    <rect x="620" y="70" width="240" height="130" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="740" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">d34cb20</text>
    <line x1="636" y1="112" x2="844" y2="112" stroke="#cbd5e1" stroke-width="1"/>
    <text x="640" y="136" font-size="12" fill="#b45309">родитель: 05cf497</text>
    <text x="640" y="160" font-size="12" fill="#334155">train.py</text>
    <text x="640" y="182" font-size="12" fill="#334155">«аугментации»</text>
  </g>

  <line x1="326" y1="135" x2="286" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#h)"/>
  <line x1="616" y1="135" x2="576" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#h)"/>

  <text x="450" y="240" text-anchor="middle" font-size="14" fill="#334155">Хэш считается от содержимого файлов, метаданных <tspan font-weight="600">и хэша родителя</tspan>.</text>
  <text x="450" y="266" text-anchor="middle" font-size="14" fill="#b91c1c">Подмените один символ в старом коммите — изменится его хэш, а значит и хэши всех следующих.</text>
  <text x="450" y="298" text-anchor="middle" font-size="13" fill="#64748b">Поэтому историю нельзя переписать незаметно, а идентификатор можно выдать локально, не спрашивая сервер.</text>
</svg>
