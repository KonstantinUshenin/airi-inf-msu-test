<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Слияние: git всегда сравнивает обе версии с общим предком</text>

  <!-- стрелки «родитель» (от потомка к предку) -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="278" y1="120" x2="222" y2="150" marker-end="url(#m)"/>
    <line x1="428" y1="120" x2="332" y2="120" marker-end="url(#m)"/>
    <line x1="278" y1="230" x2="222" y2="190" marker-end="url(#m)"/>
    <line x1="578" y1="140" x2="482" y2="128" marker-end="url(#m)"/>
    <line x1="578" y1="190" x2="332" y2="228" marker-end="url(#m)"/>
  </g>

  <!-- общий предок -->
  <circle cx="200" cy="170" r="30" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="200" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">B</text>
  <text x="200" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">общий предок</text>
  <text x="200" y="256" text-anchor="middle" font-size="12" fill="#b45309">merge base</text>

  <!-- ветка main -->
  <circle cx="305" cy="110" r="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="305" y="116" text-anchor="middle" font-size="13" fill="#1d4ed8">M1</text>
  <circle cx="455" cy="110" r="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="455" y="116" text-anchor="middle" font-size="13" fill="#1d4ed8">M2</text>
  <rect x="413" y="46" width="84" height="26" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="455" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">main</text>

  <!-- ветка feature -->
  <circle cx="305" cy="250" r="26" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="305" y="256" text-anchor="middle" font-size="13" fill="#166534">F1</text>
  <rect x="249" y="298" width="112" height="26" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="305" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">feature</text>

  <!-- коммит слияния -->
  <circle cx="605" cy="165" r="30" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <text x="605" y="171" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">M</text>
  <text x="605" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">коммит слияния</text>
  <text x="605" y="240" text-anchor="middle" font-size="12" fill="#64748b">два родителя</text>
  <text x="592" y="262" text-anchor="middle" font-size="12" fill="#1d4ed8">после слияния main — здесь</text>

  <!-- пояснение -->
  <line x1="690" y1="70" x2="690" y2="300" stroke="#e2e8f0" stroke-width="2"/>
  <text x="712" y="92" font-size="14" font-weight="600" fill="#0f172a">Что делает git</text>
  <text x="712" y="122" font-size="13" fill="#334155">Берёт три версии файла:</text>
  <text x="712" y="144" font-size="13" fill="#b45309">в предке B,</text>
  <text x="712" y="166" font-size="13" fill="#1d4ed8">в main,</text>
  <text x="712" y="188" font-size="13" fill="#166534">в feature.</text>
  <text x="712" y="222" font-size="13" fill="#334155">Менял кто-то один —</text>
  <text x="712" y="242" font-size="13" fill="#334155">берёт его правку молча.</text>
  <text x="712" y="272" font-size="13" fill="#334155">Меняли оба одно место —</text>
  <text x="712" y="292" font-size="13" font-weight="600" fill="#b91c1c">конфликт.</text>

  <text x="30" y="356" font-size="13" fill="#64748b">Конфликт — не поломка: это единственная ситуация, где git не может решить за вас, какая правка верна.</text>
  <text x="30" y="378" font-size="13" fill="#64748b">Правки в разных строках одного файла сливаются автоматически.</text>
</svg>
