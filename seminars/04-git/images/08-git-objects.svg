<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Что лежит в .git: ссылки и объекты</text>

  <!-- зона ссылок -->
  <rect x="24" y="52" width="234" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="141" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">ссылки (.git/HEAD, .git/refs)</text>

  <!-- зона объектов -->
  <rect x="288" y="52" width="588" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="582" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">объекты (.git/objects) — имя объекта = хэш содержимого</text>

  <g font-family="ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Consolas, monospace">
    <!-- HEAD -->
    <rect x="48" y="96" width="186" height="66" rx="9" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <text x="141" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">HEAD</text>
    <text x="141" y="144" text-anchor="middle" font-size="11.5" fill="#334155">ref: refs/heads/main</text>

    <!-- ветка -->
    <rect x="48" y="212" width="186" height="66" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="141" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">refs/heads/main</text>
    <text x="141" y="260" text-anchor="middle" font-size="11.5" fill="#334155">9c1d4e7</text>

    <!-- commit -->
    <rect x="312" y="96" width="176" height="182" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="400" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">commit 9c1d4e7</text>
    <line x1="328" y1="136" x2="472" y2="136" stroke="#c7d2fe" stroke-width="1"/>
    <text x="326" y="160" font-size="11.5" fill="#334155">tree ab12cd3</text>
    <text x="326" y="182" font-size="11.5" fill="#334155">parent 405ce41</text>
    <text x="326" y="204" font-size="11.5" fill="#64748b">author Student</text>
    <text x="326" y="226" font-size="11.5" fill="#64748b">date 2026-09-01</text>
    <text x="326" y="254" font-size="11.5" fill="#334155">«baseline»</text>

    <!-- tree -->
    <rect x="524" y="96" width="176" height="182" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
    <text x="612" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">tree ab12cd3</text>
    <line x1="540" y1="136" x2="684" y2="136" stroke="#fecdd3" stroke-width="1"/>
    <text x="538" y="160" font-size="11" fill="#334155">blob 7d9f0a1</text>
    <text x="554" y="178" font-size="11" fill="#0f172a">train.py</text>
    <text x="538" y="204" font-size="11" fill="#334155">blob 3ac8b52</text>
    <text x="554" y="222" font-size="11" fill="#0f172a">notes.md</text>
    <text x="538" y="254" font-size="11.5" fill="#64748b">имена файлов — здесь</text>

    <!-- blob -->
    <rect x="736" y="140" width="120" height="94" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="796" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">blob</text>
    <text x="796" y="186" text-anchor="middle" font-size="12" fill="#0f172a">7d9f0a1</text>
    <line x1="752" y1="198" x2="840" y2="198" stroke="#cbd5e1" stroke-width="1"/>
    <text x="796" y="220" text-anchor="middle" font-size="11" fill="#64748b">содержимое</text>
  </g>

  <!-- стрелки -->
  <line x1="141" y1="162" x2="141" y2="206" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="234" y1="245" x2="306" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="488" y1="160" x2="518" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="168" x2="730" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <text x="152" y="192" font-size="11" fill="#64748b">указывает</text>
  <text x="152" y="206" font-size="11" fill="#64748b">на ветку</text>
  <text x="141" y="330" text-anchor="middle" font-size="11.5" fill="#64748b">текстовые файлы</text>

  <text x="450" y="382" text-anchor="middle" font-size="13.5" fill="#0f172a">Ветка и HEAD — это текстовые файлы; вся история — объекты, адресуемые хэшем содержимого.</text>
  <text x="450" y="404" text-anchor="middle" font-size="13.5" fill="#0f172a">Пока на объект ведёт хоть одна ссылка, git обязан его хранить — поэтому .git не худеет сам.</text>
</svg>
