<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Ветка и HEAD — это указатели, а не копии файлов</text>

  <!-- ── кадр 1 ── -->
  <text x="30" y="72" font-size="15" font-weight="600" fill="#0f172a">1. Было</text>
  <g>
    <line x1="230" y1="110" x2="182" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#p)"/>
    <line x1="380" y1="110" x2="332" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#p)"/>
    <circle cx="160" cy="110" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="160" y="115" text-anchor="middle" font-size="13" fill="#0f172a">c1</text>
    <circle cx="310" cy="110" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="310" y="115" text-anchor="middle" font-size="13" fill="#0f172a">c2</text>
    <circle cx="460" cy="110" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="460" y="115" text-anchor="middle" font-size="13" fill="#0f172a">c3</text>

    <rect x="418" y="46" width="84" height="26" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="460" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">main</text>
    <line x1="460" y1="74" x2="460" y2="84" stroke="#1d4ed8" stroke-width="2" marker-end="url(#pb)"/>

    <rect x="540" y="96" width="76" height="28" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="578" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">HEAD</text>
    <line x1="536" y1="110" x2="490" y2="110" stroke="#b45309" stroke-width="2"/>
    <text x="700" y="115" font-size="13" fill="#64748b">HEAD показывает на ветку,</text>
    <text x="700" y="133" font-size="13" fill="#64748b">ветка — на коммит</text>
  </g>

  <!-- ── кадр 2 ── -->
  <text x="30" y="222" font-size="15" font-weight="600" fill="#0f172a">2. git commit</text>
  <g>
    <line x1="230" y1="260" x2="182" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#p)"/>
    <line x1="380" y1="260" x2="332" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#p)"/>
    <line x1="530" y1="260" x2="482" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#p)"/>
    <circle cx="160" cy="260" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="160" y="265" text-anchor="middle" font-size="13" fill="#0f172a">c1</text>
    <circle cx="310" cy="260" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="310" y="265" text-anchor="middle" font-size="13" fill="#0f172a">c2</text>
    <circle cx="460" cy="260" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="460" y="265" text-anchor="middle" font-size="13" fill="#0f172a">c3</text>
    <circle cx="610" cy="260" r="22" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="610" y="265" text-anchor="middle" font-size="13" fill="#166534">c4</text>

    <rect x="568" y="196" width="84" height="26" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="610" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">main</text>
    <line x1="610" y1="224" x2="610" y2="234" stroke="#1d4ed8" stroke-width="2" marker-end="url(#pb)"/>

    <rect x="690" y="246" width="76" height="28" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="728" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">HEAD</text>
    <line x1="686" y1="260" x2="640" y2="260" stroke="#b45309" stroke-width="2"/>
    <text x="30" y="300" font-size="13" fill="#64748b">Появился коммит — ярлык ветки переехал на него вместе с HEAD. Файлы старых коммитов не тронуты.</text>
  </g>

  <!-- ── кадр 3 ── -->
  <text x="30" y="372" font-size="15" font-weight="600" fill="#0f172a">3. git switch feature</text>
  <g>
    <line x1="230" y1="410" x2="182" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#p)"/>
    <line x1="380" y1="410" x2="332" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#p)"/>
    <line x1="530" y1="410" x2="482" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#p)"/>
    <circle cx="160" cy="410" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="160" y="415" text-anchor="middle" font-size="13" fill="#0f172a">c1</text>
    <circle cx="310" cy="410" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="310" y="415" text-anchor="middle" font-size="13" fill="#0f172a">c2</text>
    <circle cx="460" cy="410" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="460" y="415" text-anchor="middle" font-size="13" fill="#0f172a">c3</text>
    <circle cx="610" cy="410" r="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="610" y="415" text-anchor="middle" font-size="13" fill="#0f172a">c4</text>

    <rect x="568" y="346" width="84" height="26" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="610" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">main</text>
    <line x1="610" y1="374" x2="610" y2="384" stroke="#1d4ed8" stroke-width="2" marker-end="url(#pb)"/>

    <rect x="404" y="452" width="112" height="26" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="460" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">feature</text>
    <line x1="460" y1="450" x2="460" y2="440" stroke="#166534" stroke-width="2" marker-end="url(#pg)"/>

    <rect x="560" y="452" width="76" height="28" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="598" y="471" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">HEAD</text>
    <line x1="556" y1="466" x2="524" y2="466" stroke="#b45309" stroke-width="2"/>
  </g>
  <text x="30" y="506" font-size="13" fill="#64748b">Переключение ветки двигает только HEAD. Поэтому «создать ветку» ничего не копирует и стоит доли секунды.</text>
</svg>
