<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Три копии одного репозитория</text>

  <!-- сервер -->
  <rect x="30" y="54" width="840" height="168" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="50" y="78" font-size="14" font-weight="600" fill="#64748b">Сервер (GitHub / GitLab / Gitea)</text>

  <rect x="60" y="92" width="290" height="106" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="205" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#b45309">upstream</text>
  <text x="205" y="148" text-anchor="middle" font-size="13" fill="#334155">оригинальный репозиторий</text>
  <text x="205" y="174" text-anchor="middle" font-size="13" fill="#64748b">вам доступен только на чтение</text>

  <rect x="550" y="92" width="290" height="106" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="695" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#1d4ed8">origin</text>
  <text x="695" y="148" text-anchor="middle" font-size="13" fill="#334155">ваш форк</text>
  <text x="695" y="174" text-anchor="middle" font-size="13" fill="#64748b">чтение и запись</text>

  <!-- fork -->
  <line x1="356" y1="122" x2="544" y2="122" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a1)"/>
  <text x="450" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">fork</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#64748b">один раз,</text>
  <text x="450" y="154" text-anchor="middle" font-size="11" fill="#64748b">кнопкой на сайте</text>

  <!-- pull request -->
  <line x1="544" y1="182" x2="356" y2="182" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a1)"/>
  <text x="450" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">pull request</text>

  <!-- локальный клон -->
  <rect x="270" y="366" width="360" height="106" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="450" y="398" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Локальный клон</text>
  <text x="450" y="424" text-anchor="middle" font-size="13" fill="#334155">ваша машина — здесь вы работаете</text>
  <text x="450" y="450" text-anchor="middle" font-size="13" fill="#64748b">только тут есть рабочая копия и индекс</text>

  <!-- fetch upstream -->
  <line x1="180" y1="230" x2="320" y2="360" stroke="#b45309" stroke-width="2" marker-end="url(#a4)"/>
  <text x="40" y="300" font-size="13" font-weight="600" fill="#b45309">git fetch upstream</text>

  <!-- clone -->
  <line x1="600" y1="230" x2="450" y2="360" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a3)"/>
  <text x="474" y="286" text-anchor="end" font-size="13" font-weight="600" fill="#1d4ed8">git clone</text>

  <!-- push -->
  <line x1="580" y1="360" x2="730" y2="230" stroke="#166534" stroke-width="2" marker-end="url(#a2)"/>
  <text x="712" y="316" font-size="13" font-weight="600" fill="#166534">git push origin</text>

  <text x="450" y="492" text-anchor="middle" font-size="13" fill="#64748b">Писать вы можете только в origin. Изменения оригинала забираете из upstream, отдаёте свои — через pull request.</text>
</svg>
