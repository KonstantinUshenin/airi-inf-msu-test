<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/>
    </marker>
  </defs>

  <rect width="940" height="470" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Что делает source ~/seminar-05/demo-venv/bin/activate</text>

  <!-- кадр 1 -->
  <text x="30" y="72" font-size="15" font-weight="600" fill="#334155">Было: обычная оболочка</text>
  <rect x="30" y="86" width="400" height="118" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="46" y="110" font-size="12" fill="#64748b">PATH (первые элементы)</text>
  <rect x="46" y="120" width="150" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="121" y="140" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#0f172a">/usr/local/bin</text>
  <rect x="204" y="120" width="110" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="259" y="140" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#0f172a">/usr/bin</text>
  <rect x="322" y="120" width="80" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="362" y="140" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#0f172a">/bin</text>
  <text x="46" y="176" font-size="12.5" font-family="monospace" fill="#334155">which python3 → /usr/bin/python3</text>
  <text x="46" y="194" font-size="12.5" fill="#64748b">пакеты — общесистемные</text>

  <!-- стрелка -->
  <line x1="230" y1="212" x2="230" y2="252" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrDown)"/>
  <rect x="252" y="216" width="420" height="34" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="266" y="238" font-size="13" font-family="monospace" fill="#312e81">source ~/seminar-05/demo-venv/bin/activate</text>
  <text x="690" y="238" font-size="12.5" fill="#4338ca">выполняется в ТЕКУЩЕЙ оболочке,</text>
  <text x="690" y="254" font-size="12.5" fill="#4338ca">поэтому её PATH и меняется</text>

  <!-- кадр 2 -->
  <text x="30" y="288" font-size="15" font-weight="600" fill="#334155">Стало: та же оболочка, окружение активно</text>
  <rect x="30" y="302" width="560" height="118" rx="10" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="46" y="326" font-size="12" fill="#166534">PATH (первые элементы)</text>
  <rect x="46" y="336" width="270" height="30" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="181" y="356" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#166534">~/seminar-05/demo-venv/bin</text>
  <rect x="324" y="336" width="130" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="389" y="356" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#0f172a">/usr/local/bin</text>
  <rect x="462" y="336" width="100" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="512" y="356" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#0f172a">/usr/bin</text>
  <text x="46" y="392" font-size="12.5" font-family="monospace" fill="#0f172a">which python → ~/seminar-05/demo-venv/bin/python</text>
  <text x="46" y="410" font-size="12.5" fill="#166534">пакеты — из этого окружения</text>

  <!-- что НЕ меняется -->
  <rect x="612" y="302" width="298" height="118" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="628" y="326" font-size="13" font-weight="600" fill="#b45309">activate НЕ делает:</text>
  <text x="628" y="348" font-size="12.5" fill="#7c2d12">— не ставит пакеты</text>
  <text x="628" y="368" font-size="12.5" fill="#7c2d12">— не меняет версию Python</text>
  <text x="628" y="388" font-size="12.5" fill="#7c2d12">— не влияет на другие процессы</text>
  <text x="628" y="408" font-size="12.5" fill="#7c2d12">и на службы systemd</text>

  <text x="470" y="442" text-anchor="middle" font-size="13" fill="#64748b">Активация — это только каталог bin окружения в начале PATH, а deactivate возвращает прежний список.</text>
  <text x="470" y="460" text-anchor="middle" font-size="13" fill="#64748b">Тем же интерпретатором можно пользоваться и без активации: ~/seminar-05/demo-venv/bin/python</text>
</svg>
