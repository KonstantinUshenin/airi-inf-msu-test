<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
  </defs>

  <rect width="940" height="430" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Как оболочка ищет программу по PATH</text>

  <!-- команда -->
  <rect x="30" y="58" width="230" height="46" rx="9" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="145" y="80" text-anchor="middle" font-size="14" fill="#312e81">вы набрали команду</text>
  <text x="145" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81" font-family="monospace">course-info</text>

  <text x="300" y="76" font-size="13" fill="#334155">имени без «/» — значит, надо искать</text>
  <text x="300" y="96" font-size="13" fill="#334155">по списку каталогов из переменной PATH, слева направо</text>

  <!-- строка PATH -->
  <rect x="30" y="124" width="880" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="150" font-size="13" font-family="monospace" fill="#0f172a">PATH=~/seminar-05/course-app/bin<tspan fill="#b45309" font-weight="700">:</tspan>/usr/local/bin<tspan fill="#b45309" font-weight="700">:</tspan>/usr/bin<tspan fill="#b45309" font-weight="700">:</tspan>/bin</text>
  <text x="898" y="150" text-anchor="end" font-size="12" fill="#64748b">разделитель — «:»</text>

  <!-- каталоги -->
  <g>
    <rect x="30" y="204" width="250" height="104" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2.5"/>
    <text x="155" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">шаг 1</text>
    <text x="155" y="254" text-anchor="middle" font-size="13" font-family="monospace" fill="#0f172a">~/seminar-05/course-app/bin</text>
    <text x="155" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">course-info — есть!</text>
    <text x="155" y="298" text-anchor="middle" font-size="12" fill="#166534">файл исполняемый (бит x)</text>
  </g>
  <g opacity="0.55">
    <rect x="304" y="204" width="180" height="104" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="394" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">шаг 2</text>
    <text x="394" y="254" text-anchor="middle" font-size="13" font-family="monospace" fill="#334155">/usr/local/bin</text>
    <text x="394" y="282" text-anchor="middle" font-size="13" fill="#64748b">сюда уже не заглянут</text>
  </g>
  <g opacity="0.55">
    <rect x="508" y="204" width="180" height="104" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="598" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">шаг 3</text>
    <text x="598" y="254" text-anchor="middle" font-size="13" font-family="monospace" fill="#334155">/usr/bin</text>
    <text x="598" y="282" text-anchor="middle" font-size="13" fill="#64748b">сюда уже не заглянут</text>
  </g>
  <g opacity="0.55">
    <rect x="712" y="204" width="180" height="104" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="802" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">шаг 4</text>
    <text x="802" y="254" text-anchor="middle" font-size="13" font-family="monospace" fill="#334155">/bin</text>
    <text x="802" y="282" text-anchor="middle" font-size="13" fill="#64748b">сюда уже не заглянут</text>
  </g>

  <line x1="284" y1="256" x2="300" y2="256" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="488" y1="256" x2="504" y2="256" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="692" y1="256" x2="708" y2="256" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- результат -->
  <line x1="155" y1="312" x2="155" y2="344" stroke="#166534" stroke-width="2" marker-end="url(#arrOk)"/>
  <rect x="30" y="350" width="500" height="42" rx="9" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="46" y="377" font-size="13" font-family="monospace" fill="#0f172a">which course-info → ~/seminar-05/course-app/bin/course-info</text>

  <rect x="556" y="350" width="354" height="42" rx="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="572" y="370" font-size="12.5" fill="#7f1d1d">не нашли ни в одном каталоге —</text>
  <text x="572" y="386" font-size="12.5" font-family="monospace" fill="#7f1d1d">bash: course-info: command not found</text>

  <text x="470" y="418" text-anchor="middle" font-size="13" fill="#64748b">Побеждает первый подходящий каталог слева: свой каталог добавляют в НАЧАЛО — PATH="$HOME/bin:$PATH"</text>
</svg>
