<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="pjArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">ProxyJump: вход во внутреннюю сеть через bastion</text>

  <!-- периметр -->
  <rect x="330" y="76" width="640" height="180" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="650" y="98" text-anchor="middle" font-size="13" fill="#64748b">закрытая сеть: наружу торчит только bastion</text>

  <!-- машины -->
  <rect x="30" y="120" width="220" height="96" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="140" y="152" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Ваша машина</text>
  <text x="140" y="176" text-anchor="middle" font-size="12.5" fill="#334155">закрытый ключ здесь</text>
  <text x="140" y="196" text-anchor="middle" font-size="12.5" fill="#334155">и никуда не копируется</text>

  <rect x="370" y="120" width="220" height="96" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="152" text-anchor="middle" font-size="16" font-weight="600" fill="#78350f">bastion</text>
  <text x="480" y="176" text-anchor="middle" font-size="12.5" fill="#78350f">белый IP, ssh наружу</text>
  <text x="480" y="196" text-anchor="middle" font-size="12.5" fill="#78350f">только пробрасывает TCP</text>

  <rect x="710" y="120" width="220" height="96" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="820" y="152" text-anchor="middle" font-size="16" font-weight="600" fill="#14532d">target</text>
  <text x="820" y="176" text-anchor="middle" font-size="12.5" fill="#14532d">без внешнего адреса</text>
  <text x="820" y="196" text-anchor="middle" font-size="12.5" fill="#14532d">сюда вы и хотите попасть</text>

  <line x1="254" y1="168" x2="366" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#pjArr)"/>
  <line x1="594" y1="168" x2="706" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#pjArr)"/>

  <!-- сквозная сессия -->
  <rect x="60" y="272" width="870" height="42" rx="21" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="495" y="299" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">одна ssh-сессия, зашифрованная от вашей машины до target — bastion её содержимое не видит</text>
  <line x1="140" y1="220" x2="140" y2="268" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="820" y1="220" x2="820" y2="268" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- команды -->
  <text x="140" y="352" text-anchor="middle" font-size="13.5" fill="#334155">одной командой:</text>
  <rect x="240" y="332" width="230" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="355" y="352" text-anchor="middle" font-size="13.5" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">ssh -J bastion target</text>
  <text x="560" y="352" text-anchor="middle" font-size="13.5" fill="#334155">или в конфиге:</text>
  <rect x="640" y="332" width="290" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="785" y="352" text-anchor="middle" font-size="13.5" fill="#0f172a" font-family="ui-monospace, Menlo, Consolas, monospace">Host target / ProxyJump bastion</text>

  <text x="500" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Ключ и пароль на bastion не появляются: он даёт только транспорт,</text>
  <text x="500" y="414" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">а аутентификация идёт с вашей машины прямо на target.</text>
</svg>
