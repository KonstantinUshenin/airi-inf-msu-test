  <text x="676" y="241" font-size="13" fill="#475569">один байт на букву</text>
  <text x="44" y="285" font-size="13" fill="#475569">Кодовая точка отвечает на вопрос «какой это символ», кодировка — «какими байтами его записать». Точка одна, байты разные.</text>
