  <rect width="980" height="648" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Символ, кодовая точка, байты — и откуда берётся кракозябра</text>
  <rect x="24" y="54" width="932" height="248" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="84" font-size="15" font-weight="600" fill="#0f172a">1. Как символ превращается в байты</text>
