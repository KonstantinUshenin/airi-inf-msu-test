  <text x="676" y="119" font-size="14" font-family="ui-monospace, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#1d4ed8">.encode("utf-8")</text>
  <text x="676" y="141" font-size="13" fill="#475569">два байта на букву</text>
