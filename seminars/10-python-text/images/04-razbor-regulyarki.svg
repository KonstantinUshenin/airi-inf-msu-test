  <text x="50" y="382" font-size="14" font-family="ui-monospace, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#334155">found.groupdict()</text>
  <text x="220" y="382" font-size="13" fill="#64748b">— словарь: имя группы → кусок строки, который в неё попал</text>
  <text x="50" y="410" font-size="15" font-family="ui-monospace, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#334155">{'time': </tspan><tspan fill="#6d28d9">'2026-11-03 12:04:12'</tspan><tspan fill="#334155">, 'level': </tspan><tspan fill="#15803d">'INFO'</tspan><tspan fill="#334155">, 'epoch': </tspan><tspan fill="#c2410c">'1'</tspan><tspan fill="#334155">}</tspan></text>
  <text x="30" y="470" font-size="13" fill="#64748b">Имя группы не съезжает, когда в шаблон добавили ещё одно поле, — в отличие от номера группы.</text>
