name: lint-seminars

# Проверяет формат семинаров: длину кодовых ячеек, формат вопросов, наличие
# мотивации, уровни задач и соответствие решений задачам.
#
# Проверяются ТОЛЬКО семинары, затронутые изменением: в pull request — те, что
# правит PR, на push — те, что принёс коммит или мёрдж. Чужой долг разгребать не
# приходится, но свой семинар обязан проходить линтер начисто: исключений и
# списков «известных нарушений» у линтера нет.
#
# Близнец .gitea/workflows/lint-seminars.yml: GitHub Actions читает этот каталог,
# Gitea Actions — свой. После переезда на git.ai.msu.ru основным станет вариант
# в .gitea/workflows, этот останется для зеркала. Правьте оба файла вместе.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужна история, чтобы посчитать diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить семинары, затронутые в pull request
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/lint_seminars.py --changed "origin/${{ github.base_ref }}"

      - name: Проверить семинары, затронутые push'ем
        if: github.event_name == 'push'
        run: python3 tools/lint_seminars.py --changed HEAD^

      - name: Проверить все семинары
        if: github.event_name == 'workflow_dispatch'
        run: python3 tools/lint_seminars.py
